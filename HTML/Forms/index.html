<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Forms</title>
</head>
<body>
    <fieldset>
        <legend align="center">Basic Forms</legend>
        <form>
            <label for="fullName">Full Name : </label>
            <input type="text" name="yourName" id="fullName" placeholder="Enter your Name">

            <br>
            <br>

            <label for="email">Email :</label>
            <input type="text" name="yourEmail" id="email" placeholder="Your Email">

            <br>
            <br>

            <label for="password">Password :</label>
            <input type="password" name="password" id="password" placeholder="Your Password">

            <br>
            <br>

            <label for="cfpassword">Confirm Password :</label>
            <input type="password" name="cfpassword" id="cfpassword" placeholder="Confirm your Password">

            <br>
            <br>

            <label for="dob">Date of Birth :</label>
            <input type="date" name="dob" id="dob">

            <br>
            <br>
            
            <label for="tob">Time of Birth :</label>
            <input type="time" name="tob" id="tob"/>

            <br>
            <br>
            
            <label for="joiningtime">Date of Joining Time :</label>
            <input type="datetime-local" name="joiningTime" id="joiningTime"/>
            
            <br>
            <br>
            
            <label for="volume">Volume :</label>
            <input type="range" name="volume" id="volume" min="0" max="10" volume="3">
            
            <br>
            <br>

            <label for="mobile">Mobile No. :</label>
            <input type="number" name="mobileNo" id="mobileNo" max="10"/>

            <br>
            <br>

            <label for="resume">Resume :</label>
            <input type="file" name="resume" id="resume"/>

            <br>
            <br>

            <label for="address">Address :</label>
            <textarea name="address" id="address"></textarea>

            <br>
            <br>

            <label for="course">Course :</label>
            <select name="course" id="course">
                <option value="">--Select Course</option>
                <option value="btech">B Tech</option>
                <option value="bba">BBA</option>
                <option value="mtech">M Tech</option>
                <option value="mba">MBA</option>
            </select>

            <br>
            <br>

            <label for="gender">Gender :</label>
            <input type="radio" name="gender" id="male" value="male">
            <span>Male</span>
            <input type="radio" name="gender" id="female" value="female">
            <span>Female</span>
            <input type="radio" name="gender" id="others" value="others">
            <span>Others</span>

            <br>
            <br>
            
            <label for="skillset">SkillSet :</label>
            <input type="checbox" name="skillset" id="java" value="java">
            <span>Java</span>
            <input type="checkbox" name="skillset" id="html" value="html">
            <span>HTML</span>
            <input type="checkbox" name="skillset" id="dsa" value="dsa">
            <span>DSA</span>

            <button>Submit</button>
            
            <br>
            <br>

            <img src="./engineerimage.avif"
            alt="Engineer Image"
            width="300px" height="300px"
            >

        </form>
    </fieldset>

</body>
</html>
